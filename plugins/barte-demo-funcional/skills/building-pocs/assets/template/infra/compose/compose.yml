# The demo's local infrastructure.
#
# One service per component, and NO bind mounts. Mounting a repository file inside
# a container looks harmless and is the most annoying failure here: if the path is
# not in Docker Desktop's sharing list, it mounts an EMPTY DIRECTORY in place of
# the file and the container dies saying "is a directory". Bucket, queue and the
# seeded documents are created by the API itself at startup — see
# `provisioning.service.ts`.
#
# PROFILES
#
# The demo runs against one cloud at a time, and `CLOUD` in `.env` picks which.
# Each emulator lives in a profile of the same name, so `--profile aws` brings up
# Floci and nothing else. Postgres is in EVERY profile because the database is the
# same in all three (Aurora, Cloud SQL and Azure Database are all PostgreSQL).
#
#   docker compose --profile ${CLOUD} up -d --wait
#
# `scripts/start.sh` already does this; the line above is for whoever wants the
# raw command.

# The project name comes from the demo's FOLDER (`scripts/start.sh` exports it),
# not from a literal. With a fixed name, two demos open at once — which happens in
# any week with two proposals in flight — share containers and volumes: bringing
# the second one up RECREATES the first one's Postgres, taking the work the agent
# had already done with it.
name: ${DEMO_NAME:-demo}

services:
  # ─── common to all three clouds ──────────────────────────────────────────
  #
  # WHY A PLAIN POSTGRES AND NOT THE EMULATOR'S MANAGED DATABASE
  #
  # Floci has `rds`, and what it does when you create an instance is BRING UP A
  # POSTGRES IN A CONTAINER — for which it needs the Docker socket mounted inside
  # it, i.e. control of the machine's daemon handed to the emulator. In exchange
  # you get a control API (CreateDBCluster, DescribeDBInstances) this demo never
  # calls: the application connects by URL, exactly as it would to a real Aurora.
  #
  # Aurora with the PostgreSQL engine, Cloud SQL for PostgreSQL and Azure Database
  # for PostgreSQL ARE Postgres. Pointing at a real Postgres is the more faithful
  # version of production, not the less.
  postgres:
    image: postgres:17-alpine
    profiles: ["aws", "gcp", "azure"]
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone answers before the database accepts real connections
      # during first initialisation, when the entrypoint runs a temporary server
      # just to create the database. `-d` is what closes that gap.
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ─── AWS ─────────────────────────────────────────────────────────────────
  #
  # WHY FLOCI AND NOT LOCALSTACK
  #
  # Both speak the same API on the same port, and swapping them is one image line.
  # What decides is what the OPEN edition ships: in LocalStack, state persistence
  # is a Pro feature. In a demo that is no detail — the client closes the laptop,
  # you run `down`, and at the next meeting the work already done has to still be
  # there. Floci is MIT, needs no token, and persists.
  floci:
    image: floci/floci:latest
    profiles: ["aws"]
    environment:
      # It needs to know the name it is reached by when it returns a resource
      # address — on a compose network that is not `localhost`.
      FLOCI_HOSTNAME: floci
      # `persistent` writes on every change. `hybrid` batches and flushes every
      # five seconds — losing the last five seconds on a `down` means losing
      # exactly the last thing you showed.
      FLOCI_STORAGE_MODE: persistent
    ports:
      # Published on loopback only, to inspect from outside with the AWS CLI:
      #   aws --endpoint-url http://127.0.0.1:4566 s3 ls
      - "127.0.0.1:${AWS_LOCAL_PORT:-4566}:4566"
    volumes:
      # `/app/data`, not a path of ours: it is what the image declares in VOLUME
      # and whose permissions it prepares before dropping privileges. Pointing
      # elsewhere kills startup on the write probe.
      - floci:/app/data
    healthcheck:
      # Route compatible with LocalStack's.
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:4566/_localstack/health | grep -q s3
          && curl -sf http://localhost:4566/_localstack/health | grep -q sqs
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ─── Google Cloud ────────────────────────────────────────────────────────
  #
  # Two emulators, not one: Google publishes no Floci equivalent serving the whole
  # cloud on a single port. `fake-gcs-server` covers Cloud Storage and the official
  # Pub/Sub emulator (shipped inside the gcloud SDK) covers the queue.
  gcs:
    image: fsouza/fake-gcs-server:latest
    profiles: ["gcp"]
    command: ["-scheme", "http", "-port", "4443", "-public-host", "127.0.0.1:${GCS_PORT:-4443}"]
    ports:
      - "127.0.0.1:${GCS_PORT:-4443}:4443"
    volumes:
      - gcs:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4443/storage/v1/b >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    profiles: ["gcp"]
    command:
      - /bin/sh
      - -c
      - >-
        gcloud beta emulators pubsub start
        --project=${GCP_PROJETO:-demo-local}
        --host-port=0.0.0.0:8085
    ports:
      - "127.0.0.1:${PUBSUB_PORT:-8085}:8085"
    healthcheck:
      # The emulator answers 200 at the root when ready; `curl -f` alone would
      # fail on a 404 from a missing route, which also means "up".
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8085 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ─── Azure ───────────────────────────────────────────────────────────────
  #
  # Azurite is Microsoft's OFFICIAL emulator and covers Blob and Queue in the same
  # container — the only one of the three clouds where a single component serves
  # both ports. The `devstoreaccount1` account and its key are public and
  # documented: it is the development account, not a leaked secret.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    profiles: ["azure"]
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --location
      - /data
    ports:
      - "127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000"
      - "127.0.0.1:${AZURITE_QUEUE_PORT:-10001}:10001"
    volumes:
      - azurite:/data
    healthcheck:

      # Probe through Node, which the Azurite image has by construction. `nc` is
      # not in it, and a healthcheck calling a missing binary fails a perfectly
      # healthy service — with "is unhealthy", which says nothing about what was
      # missing.
      test:
        - CMD-SHELL
        - >-
          node -e "const n=require('net');let f=0,d=0;for(const p of [10000,10001]){
          const s=n.connect(p,'127.0.0.1');s.on('connect',()=>{s.end();if(++d===2)process.exit(f?1:0)});
          s.on('error',()=>{f=1;if(++d===2)process.exit(1)})}"
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  floci:
  postgres:
  gcs:
  azurite:
